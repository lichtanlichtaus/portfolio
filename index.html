<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LichtAnLichtAus – VJ & Mapping</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.45;
    }
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -20%;
      background: radial-gradient(ellipse at 40% 50%, rgba(255, 0, 120, 0.18) 0%, transparent 55%),
                  radial-gradient(ellipse at 65% 55%, rgba(0, 180, 255, 0.14) 0%, transparent 50%);
      animation: breathe 8s ease-in-out infinite;
      filter: blur(40px);
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .hero h1 {
      font-size: clamp(2.8rem, 9vw, 7rem);
      letter-spacing: 0.18em;
      font-weight: 200;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      animation: glow 6s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(255,255,255,0.15); }
      50% { text-shadow: 0 0 40px rgba(255,100,180,0.35), 0 0 80px rgba(0,180,255,0.2); }
    }
    .hero p { opacity: 0.6; margin-top: 1rem; font-size: 1.15rem; position: relative; z-index: 1; }
    section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10vh 1.5rem;
    }
    h2 {
      font-size: 1.25rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      font-weight: 400;
      opacity: 0.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.8rem;
    }
    .card {
      background: #0a0a0a;
      border: 1px solid #222;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s;
    }
    .card:hover {
      border-color: #444;
      transform: translateY(-4px);
    }
    .card iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
      display: block;
    }
    .card p { padding: 0.9rem 1.1rem; font-size: 0.9rem; opacity: 0.75; }
    .setup {
      background: #0a0a0a;
      border: 1px solid #222;
      padding: 1.4rem 1.6rem;
      margin-bottom: 1.2rem;
      transition: border-color 0.3s;
    }
    .setup:hover { border-color: #333; }
    .setup strong {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #fff;
    }
    .loops {
      background: #0a0a0a;
      border: 1px solid #222;
      padding: 2rem 1.8rem;
      text-align: center;
    }
